global:
  scrape_interval: 10s

scrape_configs:
  - job_name: checkout
    static_configs:
      - targets: ["checkout:8080"]

  - job_name: inventory-worker
    static_configs:
      - targets: ["inventory-worker:9091"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
