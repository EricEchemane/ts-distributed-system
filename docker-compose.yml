services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  checkout:
    build: .
    command: ["node", "dist/services/checkout/bootstrap.js"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "8080"
      OTEL_SERVICE_NAME: checkout
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # DATABASE_URL points at the host machine's Postgres; on Linux this
      # requires the extra_hosts entry below, Docker Desktop supports it natively.
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://postgres:secret@host.docker.internal:5432/mydb}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  inventory-worker:
    build: .
    command: ["node", "dist/workers/inventory-worker.js"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      METRICS_PORT: "9091"
      OTEL_SERVICE_NAME: inventory-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://postgres:secret@host.docker.internal:5432/mydb}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  redis-exporter:
    image: oliver006/redis_exporter:v1.68.0
    restart: unless-stopped
    command: ["--redis.addr=redis://redis:6379"]
    depends_on:
      redis:
        condition: service_healthy

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - checkout
      - inventory-worker
      - redis-exporter

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
